spring.application.name=gradpoint-backend
server.port=8081

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/gradpoint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=saran@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT (HS256) ----
# Secret must be at least 32 characters. Override with the JWT_SECRET env var in any real deployment.
app.jwt.secret=${JWT_SECRET:gradpoint-dev-secret-key-change-me-0123456789}
app.jwt.expiration-ms=86400000

# ---- Optional seed admin (created only when the users table is empty) ----
app.seed.enabled=true
app.seed.admin-email=admin@gradpoint.com
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
